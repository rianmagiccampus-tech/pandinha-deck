<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OBS Audio Receiver</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body style="background: transparent; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div id="status" style="color: #a855f7; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px;">
        Pandinha Deck OBS Conectado 🐼
    </div>
    
    <audio id="audio-player"></audio>

    <script>
        const socket = io();
        const player = document.getElementById('audio-player');
        let currentVolume = 1.0;

        // Puxa o volume inicial do servidor
        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                if (data.volume !== undefined) {
                    currentVolume = data.volume / 100;
                }
            }).catch(() => {});

        socket.on('connect', () => {
            console.log("Conectado ao servidor de tempo real!");
        });

        // Quando o botão for apertado no celular
        socket.on('disparar-som', (data) => {
            let audioUrl = '';
            let isLoop = false;

            // Compatibilidade total (aceita texto simples ou objeto)
            if (typeof data === 'string') {
                audioUrl = data;
            } else if (data && data.url) {
                audioUrl = data.url;
                isLoop = !!data.loop;
            }

            if (!audioUrl) return;

            // Busca o volume mais atualizado antes de dar play
            fetch('/api/settings')
                .then(res => res.json())
                .then(settings => {
                    if (settings.volume !== undefined) {
                        currentVolume = settings.volume / 100;
                    }
                    executarAudio(audioUrl, isLoop);
                }).catch(() => {
                    executarAudio(audioUrl, isLoop);
                });
        });

        function executarAudio(url, loop) {
            player.pause();
            player.currentTime = 0;
            player.src = url;
            player.volume = currentVolume;
            player.loop = loop;
            
            player.play().then(() => {
                console.log("Áudio tocando com sucesso!");
            }).catch(err => {
                console.log("Bloqueio de autoplay detetado. Interaja com a fonte no OBS:", err);
            });
        }

        // Comando para parar todos os sons imediatamente
        socket.on('parar-som', () => {
            player.pause();
            player.currentTime = 0;
            player.src = '';
            console.log("Todos os áudios foram parados.");
        });
    </script>
</body>
</html>
