<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OBS Audio Receiver</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body style="background: transparent; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div id="status" style="color: #a855f7; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px;">
        Pandinha Deck OBS Conectado 🐼
    </div>
    
    <audio id="audio-player"></audio>

    <script>
        const socket = io();
        const player = document.getElementById('audio-player');

        socket.on('connect', () => {
            console.log("Conectado ao servidor!");
        });

        socket.on('disparar-som', (data) => {
            let audioUrl = typeof data === 'string' ? data : (data ? data.url : '');
            let isLoop = data && data.loop ? true : false;

            if (!audioUrl) return;

            player.pause();
            player.currentTime = 0;
            player.src = audioUrl;
            player.loop = isLoop;
            
            // Pega o volume atual do sistema ou deixa no máximo
            fetch('/api/settings')
                .then(res => res.json())
                .then(settings => {
                    player.volume = settings.volume !== undefined ? settings.volume / 100 : 1.0;
                })
                .catch(() => { player.volume = 1.0; });

            player.play().then(() => {
                console.log("Tocando áudio!");
            }).catch(err => {
                console.log("Erro de autoplay. Interaja com a fonte no OBS:", err);
            });
        });

        socket.on('parar-som', () => {
            player.pause();
            player.currentTime = 0;
            player.src = '';
        });
    </script>
</body>
</html>
