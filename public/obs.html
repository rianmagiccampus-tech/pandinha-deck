<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OBS Audio Receiver</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body style="background: transparent; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div id="status" style="color: #a855f7; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px;">
        Pandinha Deck OBS Conectado 🐼
    </div>
    
    <audio id="audio-player"></audio>

    <script>
        const socket = io();
        const player = document.getElementById('audio-player');
        let currentVolume = 1.0;

        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                if (data.volume !== undefined) {
                    currentVolume = data.volume / 100;
                }
            });

        socket.on('connect', () => {
            console.log("Conectado ao servidor de tempo real!");
        });

        socket.on('disparar-som', (data) => {
            let audioUrl = '';
            let isLoop = false;

            if (typeof data === 'string') {
                audioUrl = data;
            } else {
                audioUrl = data.url;
                isLoop = data.loop;
            }

            fetch('/api/settings')
                .then(res => res.json())
                .then(settings => {
                    if (settings.volume !== undefined) {
                        currentVolume = settings.volume / 100;
                    }
                    player.pause();
                    player.currentTime = 0;
                    player.volume = currentVolume;
                    player.loop = isLoop;
                    player.src = audioUrl;
                    player.play().catch(err => {
                        console.log("Erro ao reproduzir:", err);
                    });
                }).catch(() => {
                    player.pause();
                    player.currentTime = 0;
                    player.volume = currentVolume;
                    player.loop = isLoop;
                    player.src = audioUrl;
                    player.play();
                });
        });

        // Comando para cortar o som imediatamente
        socket.on('parar-som', () => {
            player.pause();
            player.currentTime = 0;
            player.src = '';
        });
    </script>
</body>
</html>
